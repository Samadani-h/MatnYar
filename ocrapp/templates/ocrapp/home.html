
{% extends 'ocrapp/base.html' %}


{% block title %}صفحه اصلی{% endblock %}

{% block content %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatnYar - OCR تصویر</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body class="light-mode">
    <div class="container">
        <header>
            <div class="toggle-switch">
                <input type="checkbox" id="darkModeToggle">
                <label for="darkModeToggle"></label>
            </div>
            <div class="gear"></div>
            <h1>آپلود تصویر برای OCR</h1>
        </header>

        <main>
            <form method="post" enctype="multipart/form-data" action="/upload/">
                {% csrf_token %}
                <input type="file" name="image_file" accept="image/*" required>
                <button type="submit">تبدیل کن</button>
            </form>
            {% if download_link %}
                <div class="result">
                    <a href="{{ download_link }}" download>⬇ دانلود فایل خروجی</a>
                </div>
            {% endif %}
        </main>
    </div>

    <script>
        const toggle = document.getElementById('darkModeToggle');
        toggle.addEventListener('change', () => {
            document.body.classList.toggle('dark-mode');
        });

        const socket = io();
        socket.on('progress', (data) => {
            console.log('OCR Progress:', data);
            // به‌دلخواه نمایش یا انیمیشن اضافه شود
        });
    </script>
</body>
</html>

{% endblock %}
